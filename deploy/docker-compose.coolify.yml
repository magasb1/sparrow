# Sparrow backend for Coolify (Docker Compose resource).
#
# In Coolify: New resource → Docker Compose → this repository, branch, and
# "Docker Compose location" = /deploy/docker-compose.coolify.yml.
#
# Coolify fills the SERVICE_* variables itself (generated passwords, visible and editable under
# Environment Variables). Set the sparrowd domain (e.g. https://sparrow.example.com) and the same
# URL as SPARROW_PUBLIC_URL there before the first deploy.
# Health checks come from the images (postgres below, sparrowd's Dockerfile); the dashboard
# health-check page does not apply to compose resources.
#
# No host ports: Coolify's Traefik terminates TLS with a CA-signed certificate and forwards plain
# HTTP to sparrowd on the internal network. Enrollment links then carry no key pin and phones trust
# the certificate through the system CAs. The SRT ports of later milestones are UDP and cannot go
# through Traefik's HTTP routing.

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparrow
      POSTGRES_USER: sparrow
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparrow -d sparrow"]
      interval: 5s
      timeout: 3s
      retries: 20

  sparrowd:
    build:
      # Relative to the repository root: Coolify runs compose with --project-directory set to it.
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Tells Coolify to route the service's domain through Traefik to container port 8443.
      SERVICE_FQDN_SPARROWD_8443:
      SPARROW_DATABASE_URL: postgres://sparrow:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/sparrow
      SPARROW_ADMIN_USER: ${SPARROW_ADMIN_USER:-admin}
      SPARROW_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      # The HTTPS address phones and browsers use, e.g. https://sparrow.example.com. Required:
      # Coolify blocks the deploy until it is set.
      SPARROW_PUBLIC_URL: ${SPARROW_PUBLIC_URL:?}
      # TLS ends at Traefik; with an https:// public URL, cookies stay Secure.
      SPARROW_INSECURE_HTTP: "true"
      SPARROW_REPORT_RETENTION_DAYS: ${SPARROW_REPORT_RETENTION_DAYS:-30}
    volumes:
      - sparrow:/var/lib/sparrow

volumes:
  postgres:
  sparrow:
